name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project-knowledge:
    name: Project knowledge / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python runtime and build dependencies
        run: python -m pip install 'setuptools>=77' wheel 'mcp>=2.0,<3' 'pydantic>=2.7,<3'

      - name: Run owned and installed-wheel tests
        run: python -m unittest discover -s runtimes/project-knowledge/tests -t runtimes/project-knowledge

      - name: Run inherited upstream tests
        env:
          PYTHONPATH: runtimes/project-knowledge/vendor/review-knowledge/adapters/knowledge
        run: python -m unittest discover -s runtimes/project-knowledge/vendor/review-knowledge/adapters/knowledge/tests -p 'test_*.py'

  project-knowledge-platform-check:
    name: Project knowledge platform/config checks / Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python runtime and build dependencies
        run: python -m pip install 'setuptools>=77' wheel 'mcp>=2.0,<3' 'pydantic>=2.7,<3'

      - name: Run platform and configuration checks
        run: |
          python -m unittest discover -s runtimes/project-knowledge/tests -t runtimes/project-knowledge -p 'test_config.py'
          python -m unittest discover -s runtimes/project-knowledge/tests -t runtimes/project-knowledge -p 'test_launcher.py'
          python -m unittest discover -s runtimes/project-knowledge/tests -t runtimes/project-knowledge -p 'test_vendor.py'

  quality:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Generate and verify host payloads
        run: pnpm payloads:verify

      - name: Pack release assets
        run: pnpm release:assets

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            **/test-results/**
            **/*.log
          if-no-files-found: ignore
          retention-days: 14

  hooks:
    name: ubuntu-latest / hook tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test ticket-first hook
        run: bash .claude/hooks/tests/require-ticket-branch.test.sh

      - name: Test Codex hook adapter
        run: python3 -B -m unittest discover -s .codex/hooks/tests -v
