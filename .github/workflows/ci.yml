name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      skip_macos:
        description: Leave macOS out of the OS matrices (for release runs when macOS runners are unavailable)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.skip_macos && '["ubuntu-latest", "windows-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
        node: [22]
    steps:
      # Work-item documents sit deep under docs/work-items and pass the 260-character Windows path limit.
      - name: Allow long paths
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4

      # Setup tests run the installer's writer with Python 3.12, which newer runner images no longer ship.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Validate root Agent Plugins v1.0.0 compliance and repo hygiene
        run: |
          pnpm agent-plugin validate .
          test -z "$(git ls-files .claude .codex .cursor .agents .agent-plugins .harness)"

      # The Claude adapter's payload:verify also runs Claude Code's own validator on every built payload.
      # The version is pinned so a Claude Code release cannot change the verdict between runs.
      - name: Install Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code@2.1.318

      - name: Generate and verify host payloads
        env:
          DISABLE_AUTOUPDATER: '1'
        run: pnpm payloads:verify

      - name: Pack release assets
        run: pnpm release:assets

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            **/test-results/**
            **/*.log
          if-no-files-found: ignore
          retention-days: 14

  hooks:
    name: ubuntu-latest / hook tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test ticket-first hook
        run: bash scripts/dev-hooks/tests/require-ticket-branch.test.sh

      - name: Test ticket start and closeout
        run: python3 -B -m unittest discover -s scripts/dev-hooks/tests -p test_ticket_flow.py -v

      - name: Test Codex hook adapter
        run: python3 -B -m unittest discover -s scripts/dev-hooks/tests -p test_codex_workflow.py -v

      - name: Test file inventory guard
        run: python3 -B -m unittest discover -s scripts/dev-hooks/tests -p test_inventory_guard.py -v

  distribution:
    name: Complete release distribution / Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm release:distribution
      - run: node packages/cli/scripts/check-distribution.mjs
