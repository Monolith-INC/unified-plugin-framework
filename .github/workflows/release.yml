name: Release

# Builds every shipped plugin's payload for every host from the tagged source and attaches them to the
# GitHub release with SHA256SUMS and a build provenance attestation. `agent-plugin install --version`
# downloads these assets. Releases are made from tags on main that pass the full CI suite.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish again (it must contain this workflow)
        required: true
      skip_macos:
        description: Run the checks without macOS (use when macOS runners are unavailable)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  tag:
    name: Check the release tag
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.tag.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Require a version tag on main
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::$TAG is not a release tag such as v0.2.0 or v0.2.0-rc.1"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG is not on main; release only from main"
            exit 1
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"

  checks:
    name: Full CI suite
    needs: tag
    uses: ./.github/workflows/ci.yml
    with:
      skip_macos: ${{ inputs.skip_macos == true }}

  release:
    name: Build and publish host payloads
    needs: [tag, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Pack release assets
        run: pnpm release:assets

      - name: Setup Python for the release installer
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pack complete framework distribution
        env:
          UPF_RELEASE_VERSION: ${{ needs.tag.outputs.name }}
        run: UPF_RELEASE_VERSION="${UPF_RELEASE_VERSION#v}" pnpm release:distribution

      - name: Verify artifact-only installation
        env:
          UPF_RELEASE_VERSION: ${{ needs.tag.outputs.name }}
        run: UPF_RELEASE_VERSION="${UPF_RELEASE_VERSION#v}" node packages/cli/scripts/check-distribution.mjs

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-assets/*

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.name }}
        run: |
          case "$TAG" in
            *-*) prerelease="--prerelease" ;;
            *) prerelease="" ;;
          esac
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* --verify-tag --title "$TAG" --generate-notes $prerelease
          fi
